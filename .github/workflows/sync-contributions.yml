name: Sync contribution counts

# The counts on /contributions/ drift as pull requests merge elsewhere.
# This refreshes them weekly and commits only when a number actually changed,
# which then triggers the normal deploy. Descriptions are never touched.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:contributions

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/contributions.generated.json; then
            echo "No count changes. Nothing to commit."
            exit 0
          fi
          MERGED=$(node -p "require('./src/data/contributions.generated.json').merged")
          PROJECTS=$(node -p "require('./src/data/contributions.generated.json').projects")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/contributions.generated.json
          git commit -m "Update contribution counts to ${MERGED} merged across ${PROJECTS} projects"
          git push
